
{% extends "users/auth_base.html" %}
{% load socialaccount %}

{% block auth_content %}
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>
<div class="text-center">
    <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
        </svg>
    </div>

    <h1 class="text-[22px] font-extrabold text-slate-900 tracking-[-0.5px]">
        Sign in with GitHub
    </h1>
    <p class="mt-2 text-sm text-slate-500">
        You're about to sign in using your GitHub account.
    </p>

    <form method="post" action="{% provider_login_url 'github' %}" class="mt-6">
        {% csrf_token %}
        <button type="submit"
            class="w-full flex items-center justify-center gap-2 rounded-xl py-3 bg-linear-to-br from-[#17134b] to-[#13122f] text-white font-semibold text-[15px] transition hover:opacity-90 active:scale-95">
            Continue
        </button>
    </form>

    <a href="{% url 'users:login' %}" class="block mt-4 text-[13px] text-slate-500 hover:text-slate-700">
        Cancel
    </a>
</div>
{% endblock %}
