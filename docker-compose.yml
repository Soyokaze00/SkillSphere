services:
  db:
    image: pgvector/pgvector:pg16
    container_name: skillsphere_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: skillsphere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: skillsphere_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  celery:
    build: .
    container_name: skillsphere_celery
    command: celery -A skill_sphere worker -l info --pool=solo
    restart: unless-stopped
    profiles:
      - dev
      - prod
    depends_on:
      - db
      - redis
    env_file:
      - .env

volumes:
  pgdata:
    name: project_pgdata
  redisdata:
  esdata: