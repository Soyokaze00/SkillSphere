repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: Mypy
        entry: mypy 
        language: system
        types: [python]

      - id: bandit
        name: Bandit
        entry: bandit -r users projects dashboard feedback notifications search activity_logs skill_sphere
        language: system
        pass_filenames: false