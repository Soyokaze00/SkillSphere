{% extends "base.html" %} 
{% load static %} 

{% block content %}

<div class="w-full p-4 sm:p-6 space-y-6">

  <!-- HEADER -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
        Projects
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Browse projects
      </p>
    </div>

    <a href="{% url 'projects:create-project' %}">
      <button
        class="px-4 py-2 rounded-xl text-white font-semibold shadow-sm hover:scale-105 transition"
        style="background: linear-gradient(135deg, #4f46e5, #7c3aed)"
      >
        New Project
      </button>
    </a>
  </div>


  <!-- SEARCH BOX -->
  <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-4 space-y-4">

    <form method="GET" class="flex flex-col lg:flex-row gap-3">

      <input
        id="search"
        name="q"
        data-server-search="true"
        value="{{ query }}"
        class="flex-1 min-w-0 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
        placeholder="Search by title, description, or tags..."
      />


      <select
        id="sort"
        class="border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl px-3 py-2.5 text-sm"
      >
        <option value="-created_at">Most Recent</option>
        <option value="title">Alphabetical</option>
      </select>


      <div class="flex gap-2">

        <button
          type="button"
          onclick="setView('grid')"
          class="w-10 h-10 border border-gray-200 dark:border-gray-700 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"
        >
          ▦
        </button>

        <button
          type="button"
          onclick="setView('list')"
          class="w-10 h-10 border border-gray-200 dark:border-gray-700 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"
        >
          ☰
        </button>

      </div>

    </form>


    <!-- Categories -->
    <div id="categories" class="flex flex-wrap gap-2">

      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-indigo-600 text-white"
        data-category="all"
      >
        All
      </button>


      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300"
        data-category="open"
      >
        Open
      </button>


      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300"
        data-category="in_progress"
      >
        In Progress
      </button>


      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300"
        data-category="completed"
      >
        Completed
      </button>

    </div>

  </div>



  <!-- RESULTS -->
  <div id="resultsWrapper" class="w-full">
      {% include "projects/project_results.html" %}
  </div>


</div>


<script src="{% static 'projects/js/project_list.js' %}"></script>


{% endblock %}
