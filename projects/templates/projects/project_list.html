{% extends "base.html" %} 
{% load static %} 
{% block content %}
{% with show_loader=True %}

<div class="max-w-6xl mx-auto p-6 space-y-6">
  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold">Projects</h1>
      <p class="text-sm text-gray-500">Browse projects</p>
    </div>
    <a href="{% url 'projects:create-project' %}">
      <button
        class="px-4 py-2 rounded-xl text-white font-semibold"
        style="background: linear-gradient(135deg, #4f46e5, #7c3aed)"
      >
        New Project
      </button>
    </a>
  </div>

  <!-- SEARCH -->
  <div class="bg-white border border-gray-200 rounded-2xl p-4 space-y-4">
    <form method="GET" class="flex gap-3 flex-wrap">
      <input
        id="search"
        name="q"
        data-server-search="true"
        value="{{ query }}"
        class="flex-1 min-w-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
        placeholder="Search by title, description, or tags..."
      />

      <select
        id="sort"
        class="border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
      >
        <option value="-created_at">Most Recent</option>
        <option value="title">Alphabetical</option>
      </select>

      <button
        type="button"
        onclick="setView('grid')"
        class="px-3 border border-gray-200 rounded-xl hover:bg-gray-50"
      >
        ▦
      </button>
      <button
        type="button"
        onclick="setView('list')"
        class="px-3 border border-gray-200 rounded-xl hover:bg-gray-50"
      >
        ☰
      </button>
    </form>

    </div>

    <div id="categories" class="flex flex-wrap gap-2">
      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-indigo-600 text-white"
        data-category="all"
      >
        All
      </button>
      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-gray-100 text-gray-700"
        data-category="open"
      >
        Open
      </button>
      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-gray-100 text-gray-700"
        data-category="in_progress"
      >
        In Progress
      </button>
      <button
        class="category-btn px-3 py-1 rounded-lg text-xs bg-gray-100 text-gray-700"
        data-category="completed"
      >
        Completed
      </button>
    </div>
  </div>

  <div id="resultsWrapper">
    {% include "projects/project_results.html" %}
  </div>

</div>
<script src="{% static 'projects/js/project_list.js' %}"></script>
{% endwith %}
{% endblock %}
